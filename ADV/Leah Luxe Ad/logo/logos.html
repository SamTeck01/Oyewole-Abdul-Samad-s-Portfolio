<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Montserrat:wght@500;800&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@600;800&display=block" rel="stylesheet">
<style>
body{margin:0;background:#ddd;font-family:Montserrat}
.c{width:1000px;height:1000px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
</style></head><body>
<!-- 1 Elegant serif + sparkle -->
<div class="c" id="l1" style="background:#FFE4EF">
 <svg width="760" height="420" viewBox="0 0 760 420">
  <path d="M600 70 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10z" fill="#FF2E93"/>
  <path d="M650 150 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#FF2E93" opacity=".6"/>
  <text x="380" y="220" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="500" font-size="150" fill="#3A0D2E">Leah</text>
  <text x="380" y="330" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="62" letter-spacing="34" fill="#FF2E93">LUXE</text>
  <line x1="150" y1="375" x2="610" y2="375" stroke="#3A0D2E" stroke-width="2"/>
  <text x="380" y="408" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="22" letter-spacing="10" fill="#3A0D2E">IBADAN · NIGERIA</text>
 </svg>
</div>
<!-- 2 LL monogram badge -->
<div class="c" id="l2" style="background:#3A0D2E">
 <svg width="760" height="760" viewBox="0 0 760 760">
  <circle cx="380" cy="320" r="220" fill="none" stroke="#FFB6D5" stroke-width="4"/>
  <circle cx="380" cy="320" r="200" fill="#FF2E93"/>
  <text x="330" y="400" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="260" fill="#fff">L</text>
  <text x="430" y="440" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="260" fill="#FFD6E8" opacity=".9">L</text>
  <text x="380" y="650" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="84" letter-spacing="18" fill="#FFD6E8">LEAH LUXE</text>
 </svg>
</div>
<!-- 3 Bold modern + bag-heart icon -->
<div class="c" id="l3" style="background:#fff">
 <svg width="820" height="600" viewBox="0 0 820 600">
  <g transform="translate(330,40)">
   <path d="M40 70 Q40 10 80 10 Q120 10 120 70" fill="none" stroke="#3A0D2E" stroke-width="12" stroke-linecap="round"/>
   <rect x="0" y="60" width="160" height="170" rx="28" fill="#FF2E93"/>
   <path d="M80 190 C20 150 30 105 60 105 C72 105 80 115 80 122 C80 115 88 105 100 105 C130 105 140 150 80 190z" fill="#fff"/>
  </g>
  <text x="410" y="400" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="118" letter-spacing="6" fill="#3A0D2E">LEAH LUXE</text>
  <rect x="300" y="440" width="220" height="56" rx="28" fill="#FF2E93"/>
  <text x="410" y="479" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="30" letter-spacing="8" fill="#fff">.NG</text>
 </svg>
</div>
<!-- 4 Script glow -->
<div class="c" id="l4" style="background:radial-gradient(circle at 50% 45%,#FF5FAA,#C2186B 70%)">
 <svg width="900" height="500" viewBox="0 0 900 500">
  <defs><filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <text x="450" y="270" text-anchor="middle" font-family="Great Vibes" font-size="230" fill="#fff" filter="url(#g)">Leah Luxe</text>
  <text x="450" y="370" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="30" letter-spacing="16" fill="#FFE4EF">BEAUTY · LIFESTYLE · HOME</text>
  <path d="M770 110 l8 24 24 8 -24 8 -8 24 -8 -24 -24 -8 24 -8z" fill="#fff"/>
 </svg>
</div>
<!-- 5 Round sticker for TikTok profile -->
<div class="c" id="l5" style="background:#FFD6E8">
 <svg width="800" height="800" viewBox="0 0 800 800">
  <defs><path id="ring" d="M400 400 m-265 0 a265 265 0 1 1 530 0 a265 265 0 1 1 -530 0"/></defs>
  <circle cx="400" cy="400" r="330" fill="#FF2E93"/>
  <circle cx="400" cy="400" r="215" fill="#fff"/>
  <text font-family="Poppins" font-weight="800" font-size="46" letter-spacing="5" fill="#fff" textLength="1640" lengthAdjust="spacing"><textPath href="#ring" startOffset="0" textLength="1640">LEAH LUXE ✦ SHOP IBADAN ✦ NATIONWIDE DELIVERY ✦ </textPath></text>
  <text x="400" y="400" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="150" fill="#FF2E93">LL</text>
  <text x="400" y="470" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="38" letter-spacing="8" fill="#3A0D2E">.NG</text>
 </svg>
</div>
</body></html>
